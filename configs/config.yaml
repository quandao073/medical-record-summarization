# =============================================================================
# Medical Record Summarization — Configuration
# =============================================================================

# ---------------------------------------------------------------------------
# LLM configuration
# ---------------------------------------------------------------------------
llm:
  provider: "openai"
  model: "gpt-4o-mini"

  openai_models:
    primary: "gpt-4o"
    mini:    "gpt-4o-mini"

  local_models:
    lmstudio:
      base_url: "http://localhost:1234/v1"
      presets:
        - name: "qwen2.5-7b-instruct"
          description: "Qwen 2.5 7B — best local model for Vietnamese medical text"
        - name: "qwen3-8b"
          description: "Qwen 3 8B — thinking model, good reasoning"
        - name: "meta-llama-3.1-8b-instruct"
          description: "LLaMA 3.1 8B — English-dominant, weaker Vietnamese"
        - name: "gemma-2-9b-it"
          description: "Gemma 2 9B — Google, decent multilingual"
        - name: "google/gemma-4-e4b"
          description: "Gemma 4 E4B — Google, efficient 4B parameter model"
    ollama:
      base_url: "http://localhost:11434"
      presets:
        - name: "qwen2.5:7b"
          description: "Qwen 2.5 7B via Ollama"
        - name: "llama3.1:8b"
          description: "LLaMA 3.1 8B via Ollama"

  max_tokens: 1500
  temperature: 0

# ---------------------------------------------------------------------------
# Retrieval (C3 — Week 3)
# ---------------------------------------------------------------------------
retrieval:
  max_chunks_per_section: 15         # Hard cap per section
  top_k_default: 10

  section_top_k:
    overview:            8
    reason_for_visit:    5
    medical_history:     15
    current_medications: 15
    allergies:           5
    abnormal_labs:       20
    diagnoses:           12
    treatment_timeline:  50
    clinical_alerts:     20

  section_source_types:
    overview:            ["patient_info", "diagnoses", "vitals"]
    reason_for_visit:    ["clinical_notes"]
    medical_history:     ["clinical_notes", "diagnoses", "allergies"]
    current_medications: ["medications"]
    allergies:           ["allergies", "clinical_notes"]
    abnormal_labs:       ["labs"]
    diagnoses:           ["diagnoses"]
    treatment_timeline:  ["labs", "medications", "diagnoses", "clinical_notes"]
    clinical_alerts:     ["labs", "vitals", "allergies", "diagnoses"]

# ---------------------------------------------------------------------------
# Citation pipeline (C5 — Week 3)
# ---------------------------------------------------------------------------
citation:
  min_keyword_overlap: 2             # Minimum shared tokens for general match
  low_confidence_threshold: 0.5      # keyword-only match → LOW_CONFIDENCE
  max_chunks_per_claim: 5

# ---------------------------------------------------------------------------
# Verifier decision matrix (C6 — Week 3)
# ---------------------------------------------------------------------------
verifier:
  # When REMOVE is too aggressive, set conservative_mode=true → FLAG instead
  conservative_mode: true

# ---------------------------------------------------------------------------
# Evaluation (C7 — Week 4)
# ---------------------------------------------------------------------------
evaluation:
  rubric_criteria:
    - clinical_relevance
    - factual_correctness
    - citation_correctness
    - completeness
    - conciseness
    - vietnamese_fluency
    - safety
    - doctor_usefulness
  score_scale: [1, 5]

# ---------------------------------------------------------------------------
# Data paths (all relative to project root)
# ---------------------------------------------------------------------------
data:
  raw_dir:         "data/raw"
  dict_dir:        "data/dictionaries"
  assembled_dir:   "data/processed/assembled"
  stores_dir:      "data/processed/stores"
  outputs_dir:     "data/processed/outputs"
  eval_dir:        "eval/cases"

# ---------------------------------------------------------------------------
# PoC settings
# ---------------------------------------------------------------------------
poc:
  max_chunks_in_context: 60
  sections:
    - overview
    - reason_for_visit
    - medical_history
    - current_medications
    - allergies
    - abnormal_labs
    - diagnoses
    - treatment_timeline
    - clinical_alerts
